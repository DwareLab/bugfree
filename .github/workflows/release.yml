name: Release

# Push a tag like v0.2.0 (after `node scripts/set-version.mjs 0.2.0`) to publish the SDKs to npm
# and the API image to GHCR. Requires the NPM_TOKEN repository secret.
on:
  push:
    tags: ["v*"]

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: signs each package with this workflow's identity
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in core browser node express nextjs cli; do
            V=$(node -p "require('./packages/$p/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "packages/$p is $V, tag is $TAG. Run: node scripts/set-version.mjs $TAG"; exit 1; fi
          done
      - run: npm ci
      - run: npm run build:sdk
      - run: npm test
      - name: Publish to npm (dependencies first; skips versions already published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in core browser node express nextjs cli; do
            name="@dwarelab/bugfree-$p"
            version=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version already published"; continue; fi
            npm publish -w "$name"
          done

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # The dashboard image joins once it reads its API URL at runtime (today it's baked in at build).
        app: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dwarelab/bugfree-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
